name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm]"

      - name: Show environment
        run: |
          python --version
          python -c "import pydantic, portalocker, send2trash; print('pydantic', pydantic.VERSION, '| portalocker', portalocker.__version__)"

      - name: Import every module
        run: |
          python -c "import importlib, pkgutil, disk_doctor; [importlib.import_module(m.name) for m in pkgutil.walk_packages(disk_doctor.__path__, 'disk_doctor.')]"

      - name: Ruff
        run: ruff check src tests

      - name: Compile
        run: python -m compileall -q src tests examples

      - name: Pytest
        run: pytest -q

      # The v0.2.2 and v0.2.3 security suites are written without skips on
      # purpose: a skipped security case is indistinguishable from a passing one
      # in a green build. Each file is checked separately; a skip anywhere
      # fails the build.
      - name: Security v0.2.2 suite must not skip
        run: |
          python -c "import subprocess, sys; r = subprocess.run([sys.executable, '-m', 'pytest', '-q', '-rs', 'tests/test_security_v022.py'], capture_output=True, text=True); print(r.stdout); print(r.stderr); sys.exit(0 if r.returncode == 0 and 'skipped' not in (r.stdout + r.stderr).lower() else 1)"

      - name: Security v0.2.3 suite must not skip
        run: |
          python -c "import subprocess, sys; r = subprocess.run([sys.executable, '-m', 'pytest', '-q', '-rs', 'tests/test_security_v023.py'], capture_output=True, text=True); print(r.stdout); print(r.stderr); sys.exit(0 if r.returncode == 0 and 'skipped' not in (r.stdout + r.stderr).lower() else 1)"

      - name: Mock demo runs with no API key
        env:
          DISK_DOCTOR_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          OPENAI_API_KEY: ""
        run: python examples/mock_demo.py

      - name: CLI smoke test
        env:
          DISK_DOCTOR_API_KEY: ""
        run: |
          python -m disk_doctor --version
          python -m disk_doctor tools

  package:
    name: build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
          ls -l dist
      - name: Verify the wheel imports
        run: |
          python -m pip install dist/*.whl
          python -c "import disk_doctor; print('installed', disk_doctor.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on hardcoded secrets
        run: |
          if grep -rnE "sk-[A-Za-z0-9]{20,}" --include="*.py" --include="*.md" --include="*.yml" . ; then
            echo "::error::Possible hardcoded API key found"
            exit 1
          fi
      - name: Fail on committed env file
        run: |
          if [ -f .env ]; then echo "::error::.env must not be committed"; exit 1; fi
      - name: Fail on bytecode caches
        run: |
          if find . -name "__pycache__" -o -name "*.pyc" | grep -q .; then
            echo "::error::bytecode committed"; exit 1
          fi
